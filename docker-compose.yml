version: '3.8'

services:
  # STT Service with SraVaani (default, CPU-friendly)
  stt-sravaani:
    build:
      context: .
      dockerfile: Dockerfile.stt
    container_name: voice-agent-stt-sravaani
    ports:
      - "8001:8001"
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - STT_PORT=8001
      - STT_PROVIDER=sravaani
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./audio_clips:/app/audio_clips:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

  # STT Service with IndicConformer (requires GPU or slow on CPU)
  stt-indicconformer:
    build:
      context: .
      dockerfile: Dockerfile.stt
    container_name: voice-agent-stt-indicconformer
    ports:
      - "8002:8001"  # Different host port to avoid conflict
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - STT_PORT=8001
      - STT_PROVIDER=indicconformer
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./audio_clips:/app/audio_clips:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

